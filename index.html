<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bố cục bằng Float và Clear</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <div class="left-column">
            <h2>Cột bên trái (Main Content)</h2>
            <p>Cột bên trái chiếm 60% chiều rộng khung chứa và dùng <code>float: left</code> để trôi về phía bên trái.</p>
        </div>
        <div class="right-column">
            <h3>Cột bên phải (Sidebar)</h3>
            <p>Cột bên phải chiếm 38% chiều rộng và dùng <code>float: right</code> để trôi về phía bên phải.</p>
        </div>
    </div>

</body>
</html>
